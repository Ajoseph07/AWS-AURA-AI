<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AURA AI — Disaster Response Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root {
    --bg: #eef0f8; --surface: #ffffff; --surface-2: #f5f6fc; --sidebar: #e3e6f3;
    --line: #d7dbea; --text: #1d2440; --muted: #6b7393; --heading: #2b3a8c;
    --accent: #7c6ff0; --accent-2: #5ac8e0; --accent-soft: #e7e4fd;
    --green: #2fb67c; --yellow: #f2b630; --red: #e5484d; --shadow: 0 1px 2px rgba(30,40,90,.06), 0 4px 14px rgba(30,40,90,.05);
    --scroll-track: #e3e6f3; --scroll-thumb: #b9b2f5;
  }
  [data-theme="dark"] {
    --bg: #0d0f17; --surface: #171a26; --surface-2: #1f2333; --sidebar: #11131c;
    --line: #2a2f43; --text: #e7e9f4; --muted: #8e95b3; --heading: #c9c3ff;
    --accent: #8f83ff; --accent-soft: #2a2650; --shadow: 0 1px 2px rgba(0,0,0,.4);
    --scroll-track: #11131c; --scroll-thumb: #4a4385;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  * { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) var(--scroll-track); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--scroll-track); }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 8px; border: 2px solid var(--scroll-track); }

  .app { display: grid; grid-template-columns: 236px 1fr; height: 100vh; }
  .sidebar { background: var(--sidebar); border-right: 1px solid var(--line); padding: 16px 0; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 18px 4px; font-weight: 800; color: var(--heading); font-size: 17px; }
  .brand .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; color: #fff; font-size: 14px; }
  .tagline { padding: 0 18px 14px; font-size: 11px; color: var(--muted); }
  .nav-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 18px 6px; }
  .nav a { display: block; padding: 9px 18px; color: var(--text); text-decoration: none; font-size: 13px; border-left: 3px solid transparent; }
  .nav a:hover { background: var(--accent-soft); }
  .nav a.active { background: var(--surface); border-left-color: var(--accent); font-weight: 700; color: var(--heading); }

  .agent { margin: 14px; padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .agent h4 { margin: 0 0 4px; font-size: 12px; color: var(--heading); display: flex; align-items: center; gap: 6px; }
  .agent .live { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(47,182,124,.5);} 70%{box-shadow:0 0 0 6px rgba(47,182,124,0);} 100%{box-shadow:0 0 0 0 rgba(47,182,124,0);} }
  .agent .line { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
  .agent .line b { font-variant-numeric: tabular-nums; }
  .agent .stockout b { color: var(--red); } .agent .low b { color: var(--yellow); } .agent .high b { color: var(--green); }
  .agent .msg { font-size: 11.5px; color: var(--muted); margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; line-height: 1.4; }

  main { position: relative; display: flex; flex-direction: column; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); z-index: 500; }
  .topbar h1 { margin: 0; font-size: 18px; color: var(--heading); }
  .pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .pill.warn { background: #fdf0d2; color: #9a6b00; }
  .spacer { flex: 1; }
  button, select { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 7px 12px; font-size: 13px; font-weight: 600; }
  button.primary { background: var(--heading); border-color: var(--heading); color: #fff; }
  [data-theme="dark"] button.primary { background: var(--accent); border-color: var(--accent); color: #0d0f17; }

  .alertbar { display: none; align-items: center; gap: 12px; padding: 10px 20px; background: #fff3f3; border-bottom: 1px solid #f3c6c8; color: #8a1f24; font-size: 13px; font-weight: 600; z-index: 500; }
  [data-theme="dark"] .alertbar { background: #2a1416; color: #ffb3b6; border-color: #4a2024; }
  .alertbar.show { display: flex; }

  .maparea { position: relative; flex: 1; min-height: 0; }
  #map { position: absolute; inset: 0; background: var(--surface-2); z-index: 1; }
  .leaflet-container { font: inherit; background: var(--surface-2); }

  .legend { position: absolute; left: 14px; bottom: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); font-size: 12px; z-index: 600; }
  .legend .row { display: flex; align-items: center; gap: 7px; padding: 2px 0; }
  .legend .dot { width: 12px; height: 12px; border-radius: 50%; }
  .legend .zone { width: 14px; height: 14px; border-radius: 3px; background: rgba(229,72,77,.25); border: 1px solid var(--red); }

  .route-panel { position: absolute; right: 14px; top: 14px; width: 300px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; z-index: 600; }
  .route-panel h3 { margin: 0 0 10px; font-size: 14px; color: var(--heading); }
  .route-panel label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .route-panel select, .route-panel input { width: 100%; margin: 4px 0 10px; }
  .route-result { font-size: 12.5px; border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 4px; display: none; }
  .route-result.show { display: block; }
  .route-result .big { font-size: 13px; font-weight: 700; color: var(--heading); }
  .route-result .safe { color: var(--green); font-weight: 700; } .route-result .risk { color: var(--red); font-weight: 700; }

  .fb-pop { font-family: Inter, sans-serif; font-size: 12.5px; max-width: 230px; }
  .fb-pop h4 { margin: 0 0 2px; font-size: 13px; color: var(--heading); }
  .fb-pop .st { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px; text-transform: uppercase; margin-bottom: 6px; }
  .fb-pop .st.red { background: #fde2e3; color: #b42328; } .fb-pop .st.yellow { background: #fff0c9; color: #8a6400; } .fb-pop .st.green { background: #dff5ea; color: #1c7a4f; }
  .fb-pop ul { margin: 6px 0 0; padding-left: 16px; } .fb-pop li { margin: 1px 0; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--text); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">A</span> AURA AI</div>
    <div class="tagline">Adaptive Unified Resilience Assistant</div>
    <div class="nav-title">Views</div>
    <nav class="nav">
      <a href="/map" class="active">Disaster Response Map</a>
      <a href="/dashboard">Network Analytics</a>
      <a href="/classic">Classic paste view</a>
    </nav>
    <div class="agent" id="agent">
      <h4><span class="live"></span> Inventory Agent</h4>
      <div id="agentBody"><div class="line"><span>Loading…</span></div></div>
      <div class="msg" id="agentMsg"></div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <h1>Disaster Response Map</h1>
      <span class="pill warn">SIMULATED DATA</span>
      <span class="pill" id="hazSource">hazards: …</span>
      <div class="spacer"></div>
      <button id="refresh">Refresh</button>
      <button id="themeBtn">Dark mode</button>
    </div>

    <div class="alertbar" id="alertbar">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 2 1 21h22L12 2z" fill="currentColor"/><rect x="11" y="8" width="2" height="7" fill="#fff"/><rect x="11" y="17" width="2" height="2" fill="#fff"/></svg>
      <span id="alertText"></span>
    </div>

    <div class="maparea">
      <div id="map"></div>

      <div class="legend">
        <div class="row"><span class="dot" style="background:var(--red)"></span> High urgency / stockout</div>
        <div class="row"><span class="dot" style="background:var(--yellow)"></span> Medium — low stock</div>
        <div class="row"><span class="dot" style="background:var(--green)"></span> Well supplied</div>
        <div class="row"><span class="zone"></span> Active danger zone</div>
      </div>

      <div class="route-panel">
        <h3>Safest route for suppliers</h3>
        <label>Supplier start</label>
        <select id="originSel"></select>
        <label>Deliver to food bank</label>
        <select id="destSel"></select>
        <button class="primary" id="routeBtn" style="width:100%">Find safest route</button>
        <div class="route-result" id="routeResult"></div>
      </div>
    </div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const $ = (s) => document.querySelector(s);
const cssv = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const STATUS_COLOR = { red: '#e5484d', yellow: '#f2b630', green: '#2fb67c', none: '#9aa3bd' };
const CENTER = [37.33, -122.03];

let MAP = null, LAYER = null, ROUTE_LAYER = null, TILES = null, DATA = null, ZONES = [];
// Standard OpenStreetMap tiles — completely free, no API key.
const LIGHT_TILES = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
const DARK_TILES = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
const ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';

function initMap() {
  MAP = L.map('map', { zoomControl: true, attributionControl: true }).setView(CENTER, 10);
  setTiles();
  LAYER = L.layerGroup().addTo(MAP);
  ROUTE_LAYER = L.layerGroup().addTo(MAP);
}
function setTiles() {
  const dark = document.documentElement.dataset.theme === 'dark';
  if (TILES) MAP.removeLayer(TILES);
  TILES = L.tileLayer(dark ? DARK_TILES : LIGHT_TILES, { attribution: ATTR, maxZoom: 19 }).addTo(MAP);
  // OSM has no native dark tiles; invert them in dark mode for a dark basemap.
  const pane = MAP.getPane('tilePane');
  if (pane) pane.style.filter = dark ? 'invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)' : '';
}

async function loadData() {
  const demo = await fetch('/api/demo').then(r => r.json());
  const body = { requests: demo.requests.join('\n'), offers: demo.offers.join('\n'), scenario: demo.scenario };
  DATA = await fetch('/api/map', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json());
  ZONES = DATA.hazards.zones;
  renderAgent(); renderHazardBar(); populateSelectors(); drawMarkers();
}

function renderAgent() {
  const b = DATA.inventory.buckets;
  $('#agentBody').innerHTML = `
    <div class="line stockout"><span>Stockout</span><b>${b.stockout}</b></div>
    <div class="line low"><span>Low stock</span><b>${b.low}</b></div>
    <div class="line"><span>Medium stock</span><b>${b.medium}</b></div>
    <div class="line high"><span>High stock</span><b>${b.high}</b></div>`;
  const cov = DATA.inventory.coverage == null ? '—' : Math.round(DATA.inventory.coverage * 100) + '%';
  $('#agentMsg').innerHTML = `Network coverage <b>${cov}</b>. ${DATA.inventory.critical_open} critical request(s) still open. ` +
    (b.stockout > 0 ? `<b style="color:var(--red)">${b.stockout} food bank(s) at stockout</b> — prioritize dispatch.` : 'No stockouts right now.');
}
function renderHazardBar() {
  $('#hazSource').textContent = 'hazards: ' + (DATA.hazards.source === 'nws-live' ? 'NWS live' : 'simulated');
  const bar = $('#alertbar');
  if (ZONES.length) {
    bar.classList.add('show');
    $('#alertText').textContent = `${ZONES.length} active hazard${ZONES.length > 1 ? 's' : ''}: ` +
      ZONES.map(z => z.event).join(', ') + ' — suppliers: avoid affected corridors.';
  } else bar.classList.remove('show');
}
function populateSelectors() {
  const banks = [...DATA.markers].sort((a, b) => a.org.localeCompare(b.org));
  const opts = banks.map(m => `<option value="${m.org}">${m.org} (${m.city})</option>`).join('');
  $('#originSel').innerHTML = opts; $('#destSel').innerHTML = opts;
  const hub = banks.find(m => m.org.startsWith('Second Harvest')); if (hub) $('#originSel').value = hub.org;
  if (DATA.markers[0]) $('#destSel').value = DATA.markers[0].org;
}

function drawMarkers() {
  LAYER.clearLayers();
  const bounds = [];
  ZONES.forEach(z => {
    const col = ['Severe', 'Extreme'].includes(z.severity) ? '#e5484d' : '#f2b630';
    L.circle([z.lat, z.lon], { radius: z.radius_km * 1000, color: col, weight: 1.5, opacity: 0.6, fillColor: col, fillOpacity: 0.12 })
      .bindTooltip(`${z.event} (${z.severity})`).addTo(LAYER);
  });
  DATA.markers.forEach(m => {
    const marker = L.circleMarker([m.lat, m.lon], {
      radius: m.status === 'red' ? 9 : 7, color: '#fff', weight: 1.5,
      fillColor: STATUS_COLOR[m.status], fillOpacity: 0.95,
    }).bindPopup(popupHTML(m)).bindTooltip(m.org).addTo(LAYER);
    bounds.push([m.lat, m.lon]);
  });
  if (bounds.length) MAP.fitBounds(bounds, { padding: [50, 50] });
}
function popupHTML(m) {
  const items = m.items.map(i => `<li>${i.item} — ${Math.round(i.unmet)} unmet (${i.urgency})</li>`).join('');
  const cov = m.coverage == null ? 'no open demand' : Math.round(m.coverage * 100) + '% covered';
  return `<div class="fb-pop"><h4>${m.org}</h4><span class="st ${m.status}">${m.stock_level}</span>
    <div>${m.city} · ${cov}</div>${items ? `<ul>${items}</ul>` : ''}</div>`;
}

/* ---------- routing ---------- */
async function findRoute() {
  const o = DATA.markers.find(m => m.org === $('#originSel').value);
  const d = DATA.markers.find(m => m.org === $('#destSel').value);
  if (o.org === d.org) { showRoute({ error: 'Pick a different start and destination.' }); return; }
  $('#routeBtn').disabled = true; $('#routeBtn').textContent = 'Finding…';
  try {
    const r = await fetch('/api/route', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ origin: [o.lat, o.lon], dest: [d.lat, d.lon] }) }).then(x => x.json());
    showRoute(r, o, d); drawRoute(r, o, d);
  } catch (e) { showRoute({ error: e.message }); }
  finally { $('#routeBtn').disabled = false; $('#routeBtn').textContent = 'Find safest route'; }
}
function showRoute(r, o, d) {
  const box = $('#routeResult'); box.classList.add('show');
  if (r.error) { box.innerHTML = `<span class="risk">${r.error}</span>`; return; }
  const c = r.chosen, safe = c.danger.clear;
  box.innerHTML = `
    <div class="big">${o.org.split(' ').slice(0,3).join(' ')} <svg width="16" height="9" viewBox="0 0 16 9" style="vertical-align:middle"><path d="M0 4.5h12M9 1l3 3.5-3 3.5" stroke="var(--accent)" stroke-width="1.8" fill="none"/></svg> ${d.org.split(' ').slice(0,3).join(' ')}</div>
    <div>${c.distance}${c.duration !== '—' ? ' · ' + c.duration : ''}</div>
    <div style="margin-top:6px">${safe ? '<span class="safe">Clear of active danger zones</span>' : '<span class="risk">Crosses hazard: ' + c.danger.zones_crossed.map(z => z.event).join(', ') + '</span>'}</div>
    ${r.avoided_danger ? '<div class="safe" style="margin-top:4px">Rerouted around a more dangerous path.</div>' : ''}
    <div style="color:var(--muted);margin-top:6px">${r.note}</div>`;
}
function drawRoute(r, o, d) {
  ROUTE_LAYER.clearLayers();
  const path = r.chosen.path;  // [[lat, lon], ...]
  if (path && path.length) {
    const line = L.polyline(path, { color: cssv('--accent'), weight: 6, opacity: 0.9 }).addTo(ROUTE_LAYER);
    L.marker([o.lat, o.lon]).bindTooltip('Start: ' + o.org, { permanent: false }).addTo(ROUTE_LAYER);
    MAP.fitBounds(line.getBounds(), { padding: [60, 60] });
  }
}

/* ---------- theme ---------- */
function syncThemeBtn() { $('#themeBtn').textContent = document.documentElement.dataset.theme === 'dark' ? 'Light mode' : 'Dark mode'; }
$('#themeBtn').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; localStorage.setItem('aura-theme', t); syncThemeBtn(); setTiles();
};
document.documentElement.dataset.theme = localStorage.getItem('aura-theme') || 'light';
syncThemeBtn();
$('#refresh').onclick = loadData;
$('#routeBtn').onclick = findRoute;

/* ---------- boot ---------- */
initMap();
loadData();
</script>
</body>
</html>
