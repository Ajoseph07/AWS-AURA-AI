# AWS App Runner configuration for the AURA AI web app.
# Used when App Runner builds directly from source (not the Dockerfile path).
version: 1.0
runtime: python3
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  runtime-version: 3.12
  command: gunicorn --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 120 app:app
  network:
    port: 8000
  env:
    # Rules-based extraction by default: no IAM role or Bedrock access required,
    # the demo works out of the box. To enable live Bedrock, attach an instance
    # role with bedrock:InvokeModel and set USE_BEDROCK=1.
    - name: USE_BEDROCK
      value: "0"
    - name: BEDROCK_REGION
      value: us-east-2
    - name: BEDROCK_MODEL_ID
      value: us.anthropic.claude-haiku-4-5-20251001-v1:0
    # Hazard alerts: "1" for live National Weather Service, "0" for simulated.
    - name: AURA_LIVE_HAZARDS
      value: "0"
